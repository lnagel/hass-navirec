[project]
name = "hass-navirec"
version = "0.2.3"
description = "A Home Assistant integration for Navirec"
readme = "README.md"
requires-python = ">=3.14.2"
authors = [
    { name = "lnagel", email = "lnagel@users.noreply.github.com" }
]
dependencies = [
    "aiohttp>=3.9.0",
    "homeassistant>=2026.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-homeassistant-custom-component==0.13.355",
    "bump-my-version",
    "datamodel-code-generator",
    "diff-cover",
    "python-dotenv",
    "ruff",
    "ty",
]

[project.urls]
Documentation = "https://github.com/lnagel/hass-navirec"
Repository = "https://github.com/lnagel/hass-navirec"
Issues = "https://github.com/lnagel/hass-navirec/issues"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".git", "testing_config"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/navirec"]
omit = ["custom_components/navirec/models.py"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "CPY001", # Missing copyright notice at top of file
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # Allow assert in tests
    "S106", # Allow hardcoded passwords in tests
    "ARG001", # Allow unused arguments in fixtures
    "PLR2004", # Allow magic values in tests
]

[tool.ty.environment]
python-version = "3.14"

[[tool.ty.overrides]]
# Auto-generated models use Pydantic constrained types (constr, conint)
# which are function calls and not valid static type expressions
include = ["custom_components/navirec/models.py"]

[tool.ty.overrides.rules]
"invalid-type-form" = "ignore"

[tool.bumpversion]
current_version = "0.2.3"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "custom_components/navirec/manifest.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'
